[pytest]
pythonpath = . src
testpaths = tests
# all tests are plain functions; this stops pytest from trying to collect the
# domain classes TestCase/TestStep as test classes
python_classes =
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    live: talks to a real Ollama endpoint; only runs with SPEC2TEST_LIVE=1
# the MCP tests drive a real client, which is async
asyncio_mode = auto
