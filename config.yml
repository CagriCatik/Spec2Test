# Spec2Test configuration.
#
# This file is READ when the application starts and is never written
# automatically. Change values here for a new session, or change them in the
# window for the current session only; File > Write settings to config.yml
# stores them back deliberately (comments are lost when it does).
#
# Paths are relative to the repository root so the file stays portable.
# The cloud API key is NEVER stored here; it is read from $OLLAMA_API_KEY
# (see .env.example).

cloud:
  # Explicit mode, no implicit switching: ollama_cloud | ollama_local
  #
  # ollama_local routes through a local Ollama daemon. If that daemon is signed
  # in to ollama.com, cloud models run through it and no API key is needed here
  # - the daemon authenticates. This is the default because it works without
  # any extra setup.
  #
  # ollama_cloud talks to https://ollama.com directly and needs
  # $OLLAMA_API_KEY (see .env.example). Use it where no local daemon exists,
  # for example on a server or in CI.
  mode: ollama_local
  # host override for the selected mode; empty means the default of the mode
  # (cloud: https://ollama.com, local: model.url below)
  host: null
  connect_timeout_s: 10
  read_timeout_s: 300
  max_retries: 2

model:
  # The model name belongs to the mode:
  #   ollama_local -> the name "ollama list" shows, e.g. gpt-oss:120b-cloud
  #   ollama_cloud -> the name https://ollama.com/api/tags reports, e.g. gpt-oss:120b
  # The two namespaces are never mapped automatically; a mismatch is reported.
  name: gpt-oss:120b-cloud
  # only used in ollama_local mode
  url: http://localhost:11434
  temperature: 0.2
  top_k: 40
  top_p: 0.9
  max_tokens: 16000
  # GPU settings apply to ollama_local only and are ignored for the cloud
  gpu_layers: null
  main_gpu: null
  num_gpu: null
  num_thread: null
  use_gpu: true

generation:
  # current pipeline (application.generate), used by the window and the CLI
  group_size: 1              # requirements per generation unit
  max_cases_per_unit: 5      # resource ceiling, not a quota
  max_repair_attempts: 2     # bounded repair, then visible rejection
  input_char_budget: 12000   # oversized input is split visibly, never truncated
  # Requirements that the one under test cites are sent as supporting context.
  # They are background only and never become test targets of their own.
  use_reference_context: true
  context_char_budget: 6000  # omitted references are reported, never shortened
  max_context_items: 5
  # Full-text search over the knowledge index, on top of explicit references.
  # Build the index with: spec2test run --retrieval --knowledge requirements
  use_retrieval: false
  max_search_items: 3
  job_timeout_s: 900         # bounded runtime per job
  # Legacy flat path only (core.generate_test_cases, for existing scripts).
  # The window no longer offers these; they do not affect a normal run.
  batch_size: 5
  cases_per_prompt: 20
  combine_pages: 5

paths:
  # Portable examples - replace with your own documents.
  # pdf_path: the specification to load at startup (PDF, TXT or Markdown)
  pdf_path: requirements/01_system_architecture_and_operating_modes.md
  # prompt_path: optional project guidance. It is appended to the generation
  # rules and cannot override them; it must not prescribe an output format.
  # The advanced prompt is domain-neutral. Prompt_Expert_Test_Architect.txt is
  # written for rear-axle steering and would mislead on other domains.
  prompt_path: prompts/Prompt_Advanced_Test_Architect.txt

# Legacy flat path only; the current pipeline does not use these.
cache:
  enabled: false
  # relative to the repository root; keep user caches out of version control
  directory: cache
  max_age_hours: 24
  max_entries: 256

# Legacy flat path only; the current pipeline does not use these.
rag:
  enabled: false
  chunk_overlap: 0
  top_k: 2
