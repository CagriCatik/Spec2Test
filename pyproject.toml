[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2test"
version = "0.2.0"
description = "Turn requirements from PDF, TXT and Markdown into reviewable test drafts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    # strict local validation is mandatory: Ollama Cloud enforces no schema
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # the single PDF text extractor
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
# the existing PySide6 interface and the CSV/Excel exporters
gui = ["PySide6>=6.7", "pandas>=2.2", "openpyxl>=3.1", "tqdm>=4.66"]
# optional retrieval augmentation of the legacy path
rag = ["scikit-learn>=1.4"]
# semantic retrieval: the vectors come from a local Ollama embedding model,
# so nothing is downloaded at import time. See docs/benchmarks/retrieval-sources.md
embeddings = ["llama-index-core>=0.14", "llama-index-embeddings-ollama>=0.8"]
dev = ["pytest>=8.2"]

[project.scripts]
spec2test = "spec2test.cli:main"

[project.gui-scripts]
spec2test-gui = "spec2test.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["spec2test*"]
